name: generic
display_name: Generic chat app
app: ""
theme: auto
version: 1
notes: >
  Fallback when fingerprinting finds nothing. Colours are left unset so the
  segmenter measures the background from the image itself; tolerances are
  deliberately loose, which finds more bubbles but also more noise.

layout:
  header_fraction: 0.10
  footer_fraction: 0.10
  side_split: 0.5
  side_deadzone: 0.1
  edge_tolerance_px: 3

colors:
  tolerance: 50

segmentation:
  bg_tolerance: 14
  close_kernel: [27, 9]
  open_kernel: [3, 3]
  min_width_fraction: 0.05
  max_width_fraction: 0.98
  min_height_px: 14
  max_height_fraction: 0.8
  min_area_px: 300
  row_gap_px: 5
  attachment_variance: 1600.0
  system_max_width_fraction: 0.65
  system_center_tolerance: 0.15

senders:
  group_chat: false
  me: "Me"
  other: "Them"

fingerprint:
  min_score: 0.0
