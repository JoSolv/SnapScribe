[project]
name = "snapscribe"
version = "0.1.0"
description = "Transcribe chat conversations from smartphone screenshots and photos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "dateparser>=1.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.24", "onnxruntime>=1.18"]
vision = ["httpx>=0.27"]
gui = ["PySide6>=6.7"]

[project.scripts]
snapscribe = "snapscribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapscribe"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "C901", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that need heavy models or network",
    "ocr: tests that need the OCR extra installed",
]
